<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PredictSite | Login
    </title>


    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- CUSTOM CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >


    <style>

        /* =================================================
           LOGIN PAGE
        ================================================== */

        .auth-page {

            min-height: calc(100vh - 90px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 20px;

        }


        .auth-card {

            width: 100%;

            max-width: 500px;

            border: 3px solid #2B345B;

            background:
                rgba(15, 23, 42, 0.95);

            padding: 40px;

            box-shadow:
                7px 7px 0 rgba(194, 63, 168, 0.65);

        }


        .auth-logo {

            text-align: center;

            margin-bottom: 25px;

        }


        .auth-logo .logo {

            font-family:
                "Press Start 2P",
                monospace;

            font-size: 25px;

            text-decoration: none;

            color: #F8FAFC;

        }


        .auth-logo .logo span {

            color: #22D3EE;

        }


        .auth-badge {

            display: inline-block;

            padding: 7px 12px;

            border: 2px solid #22D3EE;

            color: #22D3EE;

            font-family:
                "VT323",
                monospace;

            font-size: 18px;

            margin-bottom: 20px;

        }


        .auth-title {

            font-family:
                "Press Start 2P",
                monospace;

            font-size: 19px;

            color: #F8FAFC;

            text-align: center;

            margin-bottom: 10px;

        }


        .auth-subtitle {

            font-family:
                "VT323",
                monospace;

            font-size: 21px;

            color: #94A3B8;

            text-align: center;

            margin-bottom: 30px;

        }


        .auth-label {

            display: block;

            font-family:
                "Press Start 2P",
                monospace;

            font-size: 10px;

            color: #CBD5E1;

            margin-bottom: 9px;

        }


        .auth-input {

            width: 100%;

            padding: 13px 14px;

            border: 2px solid #3B456F;

            background: #111827;

            color: #F8FAFC;

            font-family:
                "VT323",
                monospace;

            font-size: 21px;

            outline: none;

            margin-bottom: 20px;

        }


        .auth-input:focus {

            border-color: #22D3EE;

            box-shadow:
                0 0 0 2px rgba(
                    34,
                    211,
                    238,
                    0.12
                );

        }


        .password-row {

            position: relative;

        }


        .password-row .auth-input {

            padding-right: 55px;

        }


        .toggle-password {

            position: absolute;

            right: 12px;

            top: 10px;

            border: none;

            background: transparent;

            color: #94A3B8;

            font-size: 20px;

            cursor: pointer;

        }


        .toggle-password:hover {

            color: #22D3EE;

        }


        .forgot-link {

            display: block;

            text-align: right;

            margin-top: -12px;

            margin-bottom: 22px;

            font-family:
                "VT323",
                monospace;

            font-size: 19px;

            color: #22D3EE;

            text-decoration: none;

        }


        .forgot-link:hover {

            color: #C23FA8;

        }


        .auth-btn {

            width: 100%;

            padding: 14px;

            border: 3px solid #22D3EE;

            background: #C23FA8;

            color: #0F172A;

            font-family:
                "Press Start 2P",
                monospace;

            font-size: 11px;

            cursor: pointer;

            box-shadow:
                5px 5px 0 #22D3EE;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;

        }


        .auth-btn:hover {

            transform:
                translate(3px, 3px);

            box-shadow:
                2px 2px 0 #22D3EE;

        }


        .auth-error {

            padding: 12px;

            margin-bottom: 20px;

            border: 2px solid #EF4444;

            background:
                rgba(239, 68, 68, 0.08);

            color: #FCA5A5;

            font-family:
                "VT323",
                monospace;

            font-size: 19px;

        }


        .auth-divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 27px 0;

            color: #475569;

            font-family:
                "VT323",
                monospace;

            font-size: 17px;

        }


        .auth-divider::before,
        .auth-divider::after {

            content: "";

            flex: 1;

            height: 2px;

            background: #2B345B;

        }


        .signup-text {

            text-align: center;

            font-family:
                "VT323",
                monospace;

            font-size: 20px;

            color: #94A3B8;

            margin: 0;

        }


        .signup-text a {

            color: #22D3EE;

            text-decoration: none;

        }


        .signup-text a:hover {

            color: #C23FA8;

        }


        @media (max-width: 600px) {

            .auth-page {

                padding:
                    30px 15px;

            }


            .auth-card {

                padding: 27px 20px;

            }


            .auth-title {

                font-size: 16px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         NAVBAR
    ================================================== -->

    <nav class="navbar custom-navbar">

        <div class="container">

            <a
                class="navbar-brand logo"
                href="/"
            >

                Predict<span>Site</span>

            </a>

        </div>

    </nav>



    <!-- =================================================
         LOGIN
    ================================================== -->

    <main class="auth-page">

        <div class="auth-card">


            <div class="auth-logo">

                <div class="auth-badge">

                    🔐 SECURE LOGIN

                </div>

            </div>


            <h1 class="auth-title">

                WELCOME BACK

            </h1>


            <p class="auth-subtitle">

                Login to continue to PredictSite

            </p>



            {% if error %}

            <div class="auth-error">

                ⚠ {{ error }}

            </div>

            {% endif %}



            <form
                action="/login"
                method="POST"
            >


                <label class="auth-label">

                    EMAIL ADDRESS

                </label>


                <input
                    type="email"
                    name="email"
                    class="auth-input"
                    placeholder="Enter your email"
                    required
                >



                <label class="auth-label">

                    PASSWORD

                </label>


                <div class="password-row">

                    <input
                        type="password"
                        name="password"
                        id="loginPassword"
                        class="auth-input"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                    >

                        👁

                    </button>

                </div>



                <a
                    href="/forgot-password"
                    class="forgot-link"
                >

                    Forgot Password?

                </a>



                <button
                    type="submit"
                    class="auth-btn"
                >

                    LOGIN →

                </button>


            </form>



            <div class="auth-divider">

                OR

            </div>



            <p class="signup-text">

                Don't have an account?

                <a href="/signup">

                    Create Account

                </a>

            </p>


        </div>

    </main>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

        <div class="container">

            <div class="footer-content">

                <div>

                    <strong>
                        PredictSite
                    </strong>

                    <span>
                        Educational AI Health Prediction
                    </span>

                </div>


                <div>

                    Built with Flask + Machine Learning

                </div>

            </div>

        </div>

    </footer>



    <!-- =================================================
         PASSWORD TOGGLE
    ================================================== -->

    <script>

        function togglePassword() {

            const password =
                document.getElementById(
                    "loginPassword"
                );

            if (
                password.type === "password"
            ) {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }

    </script>


</body>

</html>
