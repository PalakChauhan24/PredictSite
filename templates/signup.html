<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PredictSite | Create Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        .auth-page {
            min-height: calc(100vh - 75px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: #1E293B;
            border: 1px solid #334155;
            padding: 38px;
            box-shadow: 8px 8px 0px #020617;
        }

        .auth-icon {
            font-size: 42px;
            text-align: center;
            margin-bottom: 15px;
        }

        .auth-title {
            text-align: center;
            font-family: "Press Start 2P", cursive;
            font-size: 19px;
            color: #F8FAFC;
            margin-bottom: 12px;
        }

        .auth-subtitle {
            text-align: center;
            color: #94A3B8;
            margin-bottom: 30px;
            font-family: "VT323", monospace;
            font-size: 20px;
        }

        .auth-label {
            display: block;
            color: #CBD5E1;
            font-family: "VT323", monospace;
            font-size: 19px;
            margin-bottom: 7px;
        }

        .auth-input {
            width: 100%;
            background: #0F172A;
            border: 2px solid #334155;
            color: #F8FAFC;
            padding: 12px 14px;
            margin-bottom: 18px;
            outline: none;
            font-family: "VT323", monospace;
            font-size: 19px;
        }

        .auth-input:focus {
            border-color: #3B82F6;
        }

        .auth-btn {
            width: 100%;
            border: none;
            background: #3B82F6;
            color: white;
            padding: 13px;
            font-family: "VT323", monospace;
            font-size: 21px;
            cursor: pointer;
            margin-top: 5px;
        }

        .auth-btn:hover {
            background: #2563EB;
        }

        .auth-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid #EF4444;
            color: #FCA5A5;
            padding: 10px 12px;
            margin-bottom: 20px;
            font-family: "VT323", monospace;
            font-size: 18px;
        }

        .auth-link {
            text-align: center;
            margin-top: 24px;
            color: #94A3B8;
            font-family: "VT323", monospace;
            font-size: 19px;
        }

        .auth-link a {
            color: #60A5FA;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .password-note {
            color: #64748B;
            font-family: "VT323", monospace;
            font-size: 16px;
            margin-top: -12px;
            margin-bottom: 18px;
        }

    </style>

</head>


<body>

    <nav class="navbar custom-navbar">

        <div class="container">

            <a
                class="navbar-brand logo"
                href="/login"
            >
                Predict<span>Site</span>
            </a>

            <span class="nav-text">
                AI-Powered Educational Health Tool
            </span>

        </div>

    </nav>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">
                📝
            </div>

            <h1 class="auth-title">
                CREATE ACCOUNT
            </h1>

            <p class="auth-subtitle">
                Join PredictSite
            </p>


            {% if error %}

            <div class="auth-error">
                ⚠ {{ error }}
            </div>

            {% endif %}


            <form
                method="POST"
                action="/signup"
            >

                <label class="auth-label">
                    NAME
                </label>

                <input
                    type="text"
                    name="name"
                    class="auth-input"
                    placeholder="Enter your name"
                    required
                >


                <label class="auth-label">
                    EMAIL
                </label>

                <input
                    type="email"
                    name="email"
                    class="auth-input"
                    placeholder="Enter your email"
                    required
                >


                <label class="auth-label">
                    PASSWORD
                </label>

                <input
                    type="password"
                    name="password"
                    class="auth-input"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <div class="password-note">
                    Minimum 6 characters
                </div>


                <label class="auth-label">
                    CONFIRM PASSWORD
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="auth-input"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="auth-btn"
                >
                    ✨ CREATE ACCOUNT
                </button>

            </form>


            <div class="auth-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </div>

        </div>

    </main>


    <footer class="footer">

        <div class="container">

            <div class="footer-content">

                <div>

                    <strong>
                        PredictSite
                    </strong>

                    <span>
                        Educational AI Health Prediction
                    </span>

                </div>

                <div>
                    Built with Flask + Machine Learning
                </div>

            </div>

        </div>

    </footer>


</body>

</html>
